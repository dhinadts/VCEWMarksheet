services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marksheets
      POSTGRES_USER: marksheets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - marksheets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marksheets -d marksheets"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - marksheets_storage:/app/storage

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  marksheets_pgdata:
  marksheets_storage:
