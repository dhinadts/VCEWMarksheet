services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marksheets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["marksheets_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marksheets"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: ./.env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./backend:/app"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "if [ -f package.json ]; then npm install && npm run dev; else echo 'Frontend is scheduled for Phase 3'; sleep infinity; fi"]
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    env_file: ./.env
    depends_on:
      - backend
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./frontend:/app"]
volumes:
  marksheets_pgdata:
